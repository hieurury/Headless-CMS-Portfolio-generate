<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>

  <!-- CMS "page" icon: two horizontal lines (content) + a spark -->
  <!-- Spark / AI star at top -->
  <path d="M32 12 L33.8 17.2 L39 19 L33.8 20.8 L32 26 L30.2 20.8 L25 19 L30.2 17.2 Z"
        fill="white" opacity="0.95"/>

  <!-- Document lines representing content blocks -->
  <rect x="14" y="30" width="36" height="4" rx="2" fill="white" opacity="0.85"/>
  <rect x="14" y="38" width="28" height="4" rx="2" fill="white" opacity="0.6"/>
  <rect x="14" y="46" width="20" height="4" rx="2" fill="white" opacity="0.4"/>
</svg>