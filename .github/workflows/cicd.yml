name: Build, Test and Deploy to Cloud Run

on:
  push:
    branches: [ "main" ] # Trigger

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  REGION: ${{ secrets.REGION }}
  REPO_NAME: ${{ secrets.REPO_NAME }}
  SERVICE_NAME: ${{ secrets.SERVICE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test -- --passWithNoTests

      - name: Build Docker Image
        run: docker build -t my-app:${{ github.sha }} . 

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Push Image to Artifact Registry
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker tag my-app:${{ github.sha }} $IMAGE_PATH
          docker push $IMAGE_PATH

      - name: Deploy to Cloud Run
        run: npx sst deploy --stage dev
        env:
          # Truyền Tag của Docker Image (Mã SHA của commit) cho SST
          IMAGE_TAG: ${{ github.sha }}
          
          # Truyền các biến môi trường ứng dụng
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          
          # BẮT BUỘC: Chìa khóa AWS để SST mở "két sắt" lưu State File
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}